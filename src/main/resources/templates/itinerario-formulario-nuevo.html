<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{itinerario.new.pageTitle}">Planificar viaje</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script>if(localStorage.getItem('darkMode')==='on')document.documentElement.setAttribute('data-theme','dark');</script>
</head>
<body>

    <header>
        <h1 th:text="#{itinerario.new.title}">🗺 Planificar nuevo viaje</h1>
        <div th:replace="~{fragments/header :: controls}"></div>
    </header>

    <main>
        <div class="table-container" style="padding:30px; max-width:650px; margin:auto;">
            <form th:action="@{/web/itinerarios/nuevo}" method="POST" id="formItinerario">

                <div class="form-group">
                    <label th:text="#{itinerario.form.name}">Nombre del viaje:</label>
                    <input type="text" name="nombre" th:placeholder="#{itinerario.form.namePlaceholder}" placeholder="Ej: Vacaciones en Barcelona" required minlength="3">
                </div>

                <div class="form-group">
                    <label th:text="#{itinerario.form.destination}">Destino:</label>
                    <select name="destinoId" required>
                        <option value="" th:text="#{itinerario.form.selectDestination}">-- Seleccionar destino --</option>
                        <option th:each="d : ${destinos}" th:value="${d.id.value}"
                                th:text="${d.nombre + ' (' + d.pais + ')'}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label th:text="#{itinerario.form.duration}">Duración (días):</label>
                    <input type="number" id="duracion" name="duracion" min="1" max="30" value="3" required>
                </div>

                <div class="form-group">
                    <label th:text="#{itinerario.form.budget}">Presupuesto total (€):</label>
                    <input type="number" id="presupuesto" name="presupuesto" min="0" step="10" value="200" required>
                    <span class="presupuesto-dia" id="presupuestoDia">~67 €/día</span>
                </div>

                <div class="form-group">
                    <label th:text="#{itinerario.form.preferences}">Preferencias (selecciona una o varias):</label>
                    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:8px;">
                        <label class="checkbox-label">
                            <input type="checkbox" class="pref-check" name="preferencias" value="cultura"> <span th:text="#{itinerario.pref.cultura}">🏛 Cultura</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="pref-check" name="preferencias" value="naturaleza"> <span th:text="#{itinerario.pref.naturaleza}">🌿 Naturaleza</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="pref-check" name="preferencias" value="gastronomia"> <span th:text="#{itinerario.pref.gastronomia}">🍽 Gastronomía</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" class="pref-check" name="preferencias" value="ocio"> <span th:text="#{itinerario.pref.ocio}">🎭 Ocio</span>
                        </label>
                    </div>
                    <div class="preferencias-preview" id="prefPreview">
                        <span style="color:var(--text-muted); font-size:13px;" th:text="#{itinerario.form.preview}">Selecciona preferencias para ver una vista previa...</span>
                    </div>
                </div>

                <div class="actions" style="margin-top:20px;">
                    <button type="submit" class="action-card" th:text="#{itinerario.form.generate}">✨ Generar itinerario</button>
                    <a th:href="@{/web/menu}" class="action-card" style="background-color:var(--border); color:var(--text);" th:text="#{common.back}">↩ Volver</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        // Indicador presupuesto por día
        const inpPresupuesto = document.getElementById('presupuesto');
        const inpDuracion = document.getElementById('duracion');
        const spanDia = document.getElementById('presupuestoDia');

        function actualizarPresupuesto() {
            const p = parseFloat(inpPresupuesto.value) || 0;
            const d = parseInt(inpDuracion.value) || 1;
            spanDia.textContent = '~' + Math.round(p / d) + ' €/día';
        }
        inpPresupuesto.addEventListener('input', actualizarPresupuesto);
        inpDuracion.addEventListener('input', actualizarPresupuesto);
        actualizarPresupuesto();

        // Vista previa de preferencias
        const checks = document.querySelectorAll('.pref-check');
        const preview = document.getElementById('prefPreview');
        const iconos = { cultura: '🏛', naturaleza: '🌿', gastronomia: '🍽', ocio: '🎭' };

        function actualizarPreferencias() {
            const seleccionadas = Array.from(checks).filter(c => c.checked);
            if (seleccionadas.length === 0) {
                preview.innerHTML = '<span style="color:var(--text-muted); font-size:13px;">Selecciona preferencias para ver una vista previa...</span>';
            } else {
                preview.innerHTML = seleccionadas.map(c =>
                    `<span class="badge badge-${c.value}">${iconos[c.value]} ${c.value.charAt(0).toUpperCase() + c.value.slice(1)}</span>`
                ).join('');
            }
        }
        checks.forEach(c => c.addEventListener('change', actualizarPreferencias));

        // Combina checkboxes en un solo campo "preferencias" como CSV
        document.getElementById('formItinerario').addEventListener('submit', function(e) {
            e.preventDefault();
            const checked = Array.from(document.querySelectorAll('input[name="preferencias"]:checked'))
                .map(cb => cb.value);
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = 'preferencias';
            hidden.value = checked.join(',');
            document.querySelectorAll('input[name="preferencias"]').forEach(cb => cb.disabled = true);
            this.appendChild(hidden);
            this.submit();
        });

        // Dark mode
        const toggleTema = document.getElementById('toggleTema');
        const aplicarTema = on => { document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light'); toggleTema.textContent = on ? '☀' : '🌙'; };
        aplicarTema(localStorage.getItem('darkMode') === 'on');
        toggleTema.addEventListener('click', () => { const on = localStorage.getItem('darkMode') !== 'on'; localStorage.setItem('darkMode', on ? 'on' : 'off'); aplicarTema(on); });
    </script>

</body>
</html>
