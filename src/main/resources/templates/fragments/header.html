<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Controles comunes de cabecera: idioma + modo oscuro + cerrar sesion.
     Se incluye con: <div th:replace="~{fragments/header :: controls}"></div>
     Los enlaces de idioma usan ?lang=xx (recargan la misma pagina cambiando el idioma). -->
<div class="header-right" th:fragment="controls">
    <div class="language-selector">
        <a href="?lang=es">ES</a>
        <a href="?lang=en">EN</a>
    </div>
    <button type="button" class="toggle-tema" id="toggleTema" th:title="#{common.theme}" title="Cambiar tema">🌙</button>
    <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit" class="toggle-tema" th:title="#{common.logout}" title="Cerrar sesión">🚪</button>
    </form>
</div>

</body>
</html>
