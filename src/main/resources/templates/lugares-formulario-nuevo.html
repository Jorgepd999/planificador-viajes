<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{lugar.new.pageTitle}">Nuevo Lugar</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script>if(localStorage.getItem('darkMode')==='on')document.documentElement.setAttribute('data-theme','dark');</script>
</head>
<body>

    <header>
        <h1 th:text="#{lugar.new.title}">📍 Nuevo lugar de interés</h1>
        <div th:replace="~{fragments/header :: controls}"></div>
    </header>

    <main>
        <div class="table-container" style="padding:30px; max-width:600px; margin:auto;">
            <form th:action="@{/web/lugares/nuevo}" method="POST">

                <div class="form-group">
                    <label th:text="#{lugar.form.name}">Nombre del lugar:</label>
                    <input type="text" name="nombre" required minlength="2">
                </div>

                <div class="form-group">
                    <label th:text="#{lugar.form.description}">Descripción:</label>
                    <textarea name="descripcion" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label th:text="#{lugar.form.type}">Tipo de actividad:</label>
                    <select name="tipo" required>
                        <option value="" th:text="#{lugar.form.select}">-- Seleccionar --</option>
                        <option value="cultura" th:text="#{tipo.cultura}">Cultura</option>
                        <option value="naturaleza" th:text="#{tipo.naturaleza}">Naturaleza</option>
                        <option value="gastronomia" th:text="#{tipo.gastronomia}">Gastronomía</option>
                        <option value="ocio" th:text="#{tipo.ocio}">Ocio</option>
                    </select>
                </div>

                <div class="form-group">
                    <label th:text="#{lugar.form.price}">Precio de entrada (€):</label>
                    <input type="number" name="precio" min="0" step="0.01" value="0">
                </div>

                <div class="form-group">
                    <label th:text="#{lugar.form.duration}">Duración estimada (horas):</label>
                    <input type="number" name="duracionVisita" min="0.5" step="0.5" value="1.0" required>
                </div>

                <div class="form-group">
                    <label th:text="#{lugar.form.destination}">Destino:</label>
                    <select name="destinoId" required>
                        <option value="" th:text="#{lugar.form.selectDestination}">-- Seleccionar destino --</option>
                        <option th:each="d : ${destinos}" th:value="${d.id.value}" th:text="${d.nombre + ' (' + d.pais + ')'}"></option>
                    </select>
                </div>

                <div class="actions" style="margin-top:20px;">
                    <button type="submit" class="action-card" th:text="#{common.save}">💾 Guardar</button>
                    <a th:href="@{/web/lugares/lista}" class="action-card" style="background:var(--border); color:var(--text);" th:text="#{common.back}">↩ Volver</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        const toggleTema = document.getElementById('toggleTema');
        const aplicarTema = on => { document.documentElement.setAttribute('data-theme', on ? 'dark' : 'light'); toggleTema.textContent = on ? '☀' : '🌙'; };
        aplicarTema(localStorage.getItem('darkMode') === 'on');
        toggleTema.addEventListener('click', () => { const on = localStorage.getItem('darkMode') !== 'on'; localStorage.setItem('darkMode', on ? 'on' : 'off'); aplicarTema(on); });
    </script>

</body>
</html>
